<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPX Auto - Weekly Report & Cost Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f1f5f9; }
    </style>
</head>
<body class="text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white p-4 shadow-lg flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-blue-600 p-2.5 rounded-xl font-bold text-xl">📊</div>
            <div>
                <h1 class="text-xl font-bold">SPX Auto - Maintenance & Cost Tracker</h1>
                <p class="text-xs text-slate-400">ภาพรวมรายงาน Ticket และยอดค่าใช้จ่าย (AC Cost Tracker) ประจำสัปดาห์</p>
            </div>
        </div>
        
        <!-- Dropdown เลือกสัปดาห์ -->
        <div class="flex items-center gap-3 bg-slate-800 p-2 rounded-xl border border-slate-700">
            <label for="weekSelect" class="text-sm font-medium text-slate-300">เลือกสัปดาห์:</label>
            <select id="weekSelect" onchange="changeWeek()" class="bg-slate-900 text-blue-400 font-bold text-sm rounded-lg px-3 py-1.5 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <!-- โหลดรายการอัตโนมัติ -->
            </select>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 space-y-6">

        <!-- KPI Cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-blue-500 hover:shadow-md transition-all">
                <p class="text-xs font-semibold text-slate-400 uppercase">Ticket Received</p>
                <p id="kpi-received" class="text-2xl font-bold text-slate-800 mt-1">--</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-amber-500 hover:shadow-md transition-all">
                <p class="text-xs font-semibold text-slate-400 uppercase">Total Valid Ticket</p>
                <p id="kpi-valid" class="text-2xl font-bold text-amber-600 mt-1">--</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-green-500 hover:shadow-md transition-all">
                <p class="text-xs font-semibold text-slate-400 uppercase">Completed (SLA)</p>
                <p id="kpi-completed" class="text-2xl font-bold text-green-600 mt-1">--</p>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-purple-500 hover:shadow-md transition-all">
                <p class="text-xs font-semibold text-slate-400 uppercase">% Complete SLA</p>
                <p id="kpi-sla" class="text-2xl font-bold text-purple-600 mt-1">--%</p>
            </div>
            <!-- การ์ดแสดงยอดเงินจริง -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 border-l-4 border-l-emerald-600 hover:shadow-md transition-all col-span-2 md:col-span-1">
                <p class="text-xs font-semibold text-emerald-600 uppercase">💰 Total Cost Completed (THB)</p>
                <p id="kpi-amount" class="text-2xl font-bold text-emerald-600 mt-1">฿0.00</p>
            </div>
        </div>

        <!-- กราฟแนวโน้ม -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-4">
                <h2 class="font-bold text-slate-800 text-base md:text-lg">📈 แนวโน้มจำนวน Ticket และ % Complete SLA</h2>
                <span class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full font-medium">Week 26 - Week 3
